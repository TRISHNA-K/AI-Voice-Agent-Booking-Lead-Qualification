[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-agent-booking-lead-qualification"
version = "1.0.0"
description = "Conversational Voice AI agents for inbound appointment booking and outbound lead qualification using Dograh AI, Python, Cal.com, and CRM integrations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Trishna K" }
]
keywords = [
    "voice-ai",
    "dograh",
    "calcom",
    "crm",
    "lead-qualification",
    "appointment-booking",
    "fastapi",
    "telephony",
    "llm-tools"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "openai>=1.20.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
